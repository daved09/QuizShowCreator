name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without "v" (e.g. 1.2.0). Empty = version from package.json'
        required: false
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Determine and validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-$(node -p "require('./package.json').version")}"
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION' (expected e.g. 1.2.0 or 1.2.0-beta.1)"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists. Choose a new version."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

  build:
    name: Build (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            dist-script: dist
            artifact-glob: release/*.AppImage
          - os: windows-latest
            dist-script: dist:win
            artifact-glob: release/*.exe
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Set version
        shell: bash
        run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build app
        run: npm run ${{ matrix.dist-script }} -- --publish never

      - uses: actions/upload-artifact@v5
        with:
          name: build-${{ matrix.os }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: build-*
          path: dist-release
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: ${{ inputs.prerelease && 'Prerelease' || 'Release' }} ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist-release/*

  bump-version:
    name: Open version bump PR
    needs: [prepare, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      RELEASED: ${{ needs.prepare.outputs.version }}
      BASE: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Bump version to next patch
        id: bump
        run: |
          npm version "$RELEASED" --no-git-tag-version --allow-same-version >/dev/null
          NEXT="$(npm version patch --no-git-tag-version)"
          NEXT="${NEXT#v}"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Released $RELEASED, next version $NEXT"

      - name: Create pull request
        env:
          NEXT: ${{ steps.bump.outputs.next }}
        run: |
          BRANCH="chore/bump-version-$NEXT"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add package.json package-lock.json
          git commit -m "Bump version to $NEXT"
          git push --force origin "$BRANCH"
          gh pr create \
            --base "$BASE" \
            --head "$BRANCH" \
            --title "Bump version to $NEXT" \
            --body "Release $RELEASED was published. This PR bumps the version in package.json to $NEXT for the next release."
